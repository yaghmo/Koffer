[package]
name = "password_manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "password_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
aes-gcm = "0.10"
getrandom = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
arboard = "3"
thiserror = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1"
base64 = "0.22"
tauri-plugin-dialog = "2"
zeroize = "1"
tokio = { version = "1", features = ["net"] }
# Serves the loopback bridge the browser extension talks to. Chosen over
# axum/hyper because the endpoint is four routes on 127.0.0.1 and hand-rolled
# HTTP parsing is exactly the wrong corner to cut.
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[dev-dependencies]
tempfile = "3"
