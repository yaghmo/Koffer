[package]
name = "password_manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "password_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
aes-gcm = "0.10"
getrandom = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
arboard = "3"
thiserror = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# SHA-1 for the leaked-password check's k-anonymity lookup; already in the
# tree through totp-rs.
sha1 = "0.10"
regex = "1"
base64 = "0.22"
tauri-plugin-dialog = "2"
zeroize = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }
# Serves the loopback bridge the browser extension talks to. hyper rather
# than a hand-rolled parser for the obvious reason, and rather than tiny_http
# because tiny_http gives no way to put a deadline on a connection: it parses
# on its own unbounded thread pool, so a process that opens sockets and says
# nothing costs one OS thread each, forever. Both of these are already in the
# tree behind reqwest, so this is not a new build.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# ECDSA P-256, to verify what the extension signs. The browser holds a key
# WebCrypto will not export, so there is no bearer string to steal.
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
# The real Public Suffix List, compiled in. The hand-written table it
# replaces decided whether one site's saved login may be offered to another.
psl = "2"
totp-rs = { version = "5.7.2", features = ["otpauth"] }
rqrr = "0.10.1"
# Draws a 2FA key back as a QR code in the editor.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[dev-dependencies]
tempfile = "3"
