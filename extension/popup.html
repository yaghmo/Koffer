<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Koffer</title>
<style>
  /* The app's look (DESIGN.md, "suit and shirt"): a black jacket across the
     top, everything else on the white shirt, one red button per state. The
     fonts ship with the extension; nothing is fetched. */
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; font-display: swap; src: url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 500; font-display: swap; src: url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 600; font-display: swap; src: url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); }
  :root {
    color-scheme: light;
    --jacket: #121212;
    --jacket-soft: #1f1f1f;
    --jacket-line: #2a2a2a;
    --on-jacket: #f5f5f5;
    --on-jacket-muted: #a3a3a3;
    --shirt: #ffffff;
    --soft: #f4f4f3;
    --line: #e4e4e2;
    --ink: #141414;
    --muted: #6b6b6b;
    --tie: #c8102e;
    --tie-pressed: #a90d27;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    width: 320px;
    margin: 0;
    background: var(--shirt);
    color: var(--ink);
    font: 13px/1.45 var(--sans);
    -webkit-font-smoothing: antialiased;
    caret-color: var(--ink);
  }
  ::selection { background: var(--ink); color: var(--shirt); }
  :focus { outline: none; }
  /* Ink, never red: a focused control must not look like the primary action. */
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button { font: inherit; }

  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: var(--jacket);
    color: var(--on-jacket);
  }
  header svg { flex: none; width: 20px; height: 20px; }
  h1 { margin: 0; font-size: 13px; font-weight: 600; }

  /* Two panels split by a hairline: what the page is, then what the vault
     has for it. */
  #page {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  #vault { display: flex; flex-direction: column; gap: 8px; padding: 16px; }
  /* A state that is one message and one button. */
  .stack { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .stack .primary { margin-top: 4px; }

  .origin { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .muted { color: var(--ink); }
  .dim { color: var(--muted); font-size: 12px; }
  .caption { color: var(--muted); font-size: 12px; }
  .error { color: var(--tie); font-size: 12px; }
  .error:empty { display: none; }

  ul { list-style: none; margin: 0; padding: 0; }
  li + li { margin-top: 4px; }
  button.more {
    align-self: flex-start;
    padding: 0;
    border: 0;
    background: none;
    color: var(--ink);
    font-size: 12px;
    text-align: left;
    text-decoration: underline;
    text-decoration-color: var(--muted);
    text-underline-offset: 3px;
    cursor: pointer;
  }
  button.more:hover { text-decoration-color: var(--ink); }

  /* A row reaches 8px past the text on each side, so its hover fill has room
     around the logo while the logo stays on the panel's 16px line. */
  button.item {
    width: calc(100% + 16px);
    margin: 0 -8px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    text-align: left;
    cursor: pointer;
    transition: background-color .15s ease-out;
  }
  button.item:hover:not(:disabled) { background: var(--soft); }
  button.item:disabled { cursor: not-allowed; opacity: .5; }
  .text { display: flex; flex-direction: column; min-width: 0; }
  .title { font-weight: 500; }
  .title, .sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { font-size: 12px; color: var(--muted); }

  /* The login's logo, with the provider it signs in through on its corner. */
  .logo {
    position: relative;
    flex: none;
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--shirt);
  }
  .logo img { width: 22px; height: 22px; object-fit: contain; border-radius: 4px; }
  .logo.letter { border-color: var(--ink); background: var(--ink); color: var(--shirt); font-weight: 600; }
  .logo .badge {
    position: absolute;
    right: -4px;
    bottom: -4px;
    width: 16px;
    height: 16px;
    padding: 2px;
    display: inline-flex;
    border-radius: 4px;
    background: var(--shirt);
    box-shadow: 0 0 0 1px var(--line);
  }
  .logo .badge svg { width: 100%; height: 100%; }

  /* Personal info: an ID card cut from the jacket, so it never reads as one
     more login. */
  button.idcard {
    width: 100%;
    margin-bottom: 4px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    border: 0;
    border-radius: 6px;
    background: var(--jacket);
    color: var(--on-jacket);
    text-align: left;
    cursor: pointer;
    transition: background-color .15s ease-out;
  }
  button.idcard:hover:not(:disabled) { background: var(--jacket-soft); }
  button.idcard:disabled { cursor: not-allowed; opacity: .5; }
  .id-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--on-jacket-muted);
  }
  .id-chip {
    padding: 0 4px;
    border: 1px solid var(--jacket-line);
    border-radius: 4px;
    font-family: var(--mono);
    color: var(--on-jacket);
  }
  .id-body { display: flex; align-items: center; gap: 12px; }
  .id-photo {
    flex: none;
    width: 36px;
    height: 44px;
    padding: 4px;
    display: inline-flex;
    border: 1px solid var(--jacket-line);
    border-radius: 4px;
  }
  .id-photo svg { width: 100%; height: 100%; }
  .idcard .sub { color: var(--on-jacket-muted); }
  .id-strip {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    color: var(--on-jacket-muted);
    overflow: hidden;
    white-space: nowrap;
  }

  /* Not a button: a provider login has nothing to fill, only an account to
     be reminded of. Dashed border so it never reads as clickable. */
  .hint {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px;
    border: 1px dashed var(--line);
    border-radius: 6px;
  }
  button.hint {
    width: 100%;
    background: transparent;
    color: inherit;
    text-align: left;
    cursor: pointer;
    transition: background-color .15s ease-out, border-color .15s ease-out;
  }
  button.hint:hover { border-style: solid; border-color: var(--ink); background: var(--soft); }
  .hint .who { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }

  .row { display: flex; gap: 8px; align-self: stretch; }
  .code {
    flex: 1;
    min-width: 0;
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--shirt);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: .16em;
    text-transform: uppercase;
    transition: border-color .15s ease-out;
  }
  .code::placeholder { color: var(--muted); font-size: 12px; letter-spacing: .08em; }
  .code:focus { border-color: var(--ink); }
  /* The tie: the one thing to press in the state on show. */
  .primary {
    height: 36px;
    padding: 0 16px;
    border: 0;
    border-radius: 6px;
    background: var(--tie);
    color: #ffffff;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color .15s ease-out;
  }
  .primary:hover:not(:disabled) { background: var(--tie-pressed); }
  .primary:disabled { opacity: .5; cursor: not-allowed; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <header>
    <!-- The mark: black case, yellow handle, red keyhole, on its white tile (src/components/Emblem.tsx). -->
    <svg viewBox="0 0 256 256" aria-hidden="true">
      <rect width="256" height="256" rx="56" fill="#ffffff"/>
      <g transform="translate(128 128) scale(.8) translate(-128 -128)">
      <path fill="#ffd60a" fill-rule="evenodd" d="M88 96V64a24 24 0 0 1 24-24h32a24 24 0 0 1 24 24V96ZM108 96V66a6 6 0 0 1 6-6h28a6 6 0 0 1 6 6V96Z"/>
      <path fill="#141414" fill-rule="evenodd" d="M54 92H202a26 26 0 0 1 26 26V190a26 26 0 0 1-26 26H54a26 26 0 0 1-26-26V118a26 26 0 0 1 26-26ZM60 92h10v124h-10ZM186 92h10v124h-10Z"/>
      <path fill="#c8102e" d="M128 118a20 20 0 0 1 11.8 36.2L146 192H110l6.2-37.8A20 20 0 0 1 128 118Z"/>
      </g>
    </svg>
    <h1>Koffer</h1>
  </header>
  <div id="page"><span class="dim">Checking this page…</span></div>
  <div id="vault"><span class="dim">Checking the vault…</span></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
