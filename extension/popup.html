<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Password Manager</title>
<style>
  :root {
    color-scheme: dark;
    --surface: #0b0e15;
    --raised: #191b23;
    --line: #464554;
    --text: #e1e2ec;
    --muted: #c7c4d7;
    --dim: #908fa0;
    --accent: #c0c1ff;
  }
  * { box-sizing: border-box; }
  body {
    width: 320px;
    margin: 0;
    padding: 14px;
    background: var(--surface);
    color: var(--text);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--dim);
  }
  /* A flex column so every state gets the same breathing room without each
     one remembering to add a margin. */
  .card {
    display: flex;
    flex-direction: column;
    gap: 7px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    background: var(--raised);
  }
  .card + .card { margin-top: 8px; }
  /* A standalone action sits centred, clear of the text above it. */
  .card > .primary { align-self: center; margin-top: 3px; padding: 8px 20px; }
  /* States that are one message and one button read better centred. */
  .stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    padding: 2px 0;
    text-align: center;
  }
  .stack .primary { margin-top: 3px; padding: 8px 20px; }
  .origin {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12px;
    color: var(--accent);
    overflow-wrap: anywhere;
  }
  .muted { color: var(--muted); }
  .dim { color: var(--dim); font-size: 12px; }
  ul { list-style: none; margin: 1px 0 0; padding: 0; }
  .caption { font-size: 11px; color: var(--dim); }
  li + li { margin-top: 6px; }
  button.item {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  button.item:hover:not(:disabled) { border-color: var(--accent); }
  button.item:disabled { cursor: not-allowed; opacity: .55; }
  .title { font-weight: 600; }
  .sub { font-size: 12px; color: var(--muted); }
  /* Not a button: a provider login has nothing to fill, only an account to
     be reminded of. Dashed border so it never reads as clickable. */
  .hint {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px 10px;
    border: 1px dashed var(--line);
    border-radius: 8px;
  }
  .hint .who {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12px;
    color: var(--accent);
    overflow-wrap: anywhere;
  }
  /* The item and its copy button share one row, so the button is a paste
     route for the fields the filler cannot name -- a PIN, a CVV, a second
     form -- without competing with the fill for the obvious click. */
  .pair { display: flex; gap: 6px; align-items: stretch; }
  .pair button.item { flex: 1; min-width: 0; }
  button.copy {
    flex: 0 0 auto;
    padding: 0 9px;
    white-space: nowrap;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  button.copy:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
  button.copy:disabled { cursor: not-allowed; opacity: .55; }
  .row { display: flex; gap: 6px; }
  .code {
    flex: 1;
    min-width: 0;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 14px;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .code:focus { outline: none; border-color: var(--accent); }
  .primary {
    padding: 7px 14px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #1a1b2a;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .primary:disabled { opacity: .55; cursor: not-allowed; }
</style>
</head>
<body>
  <h1>Password Manager</h1>
  <div id="page" class="card"><span class="dim">Checking this page…</span></div>
  <div id="vault" class="card"><span class="dim">Checking the vault…</span></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
