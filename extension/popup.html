<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Password Manager</title>
<style>
  :root {
    color-scheme: dark;
    --surface: #0b0e15;
    --raised: #191b23;
    --line: #464554;
    --text: #e1e2ec;
    --muted: #c7c4d7;
    --dim: #908fa0;
    --accent: #c0c1ff;
  }
  * { box-sizing: border-box; }
  body {
    width: 320px;
    margin: 0;
    padding: 14px;
    background: var(--surface);
    color: var(--text);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--dim);
  }
  /* A flex column so every state gets the same breathing room without each
     one remembering to add a margin. */
  .card {
    display: flex;
    flex-direction: column;
    gap: 7px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    background: var(--raised);
  }
  .card + .card { margin-top: 8px; }
  /* A standalone action sits centred, clear of the text above it. */
  .card > .primary { align-self: center; margin-top: 3px; padding: 8px 20px; }
  /* States that are one message and one button read better centred. */
  .stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    padding: 2px 0;
    text-align: center;
  }
  .stack .primary { margin-top: 3px; padding: 8px 20px; }
  .origin {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12px;
    color: var(--accent);
    overflow-wrap: anywhere;
  }
  .muted { color: var(--muted); }
  .dim { color: var(--dim); font-size: 12px; }
  ul { list-style: none; margin: 1px 0 0; padding: 0; }
  .caption { font-size: 11px; color: var(--dim); }
  button.more { background: none; border: 0; padding: 0; font: inherit; font-size: 12px; color: var(--accent); cursor: pointer; text-align: left; }
  button.more:hover { text-decoration: underline; }
  li + li { margin-top: 6px; }
  button.item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  button.item:hover:not(:disabled) { border-color: var(--accent); }
  button.item:disabled { cursor: not-allowed; opacity: .55; }
  .text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .title { font-weight: 600; }
  .title, .sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The login's logo, with the provider it signs in through on its corner. */
  .logo {
    position: relative;
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    background: #272a32;
  }
  .logo img { width: 22px; height: 22px; object-fit: contain; border-radius: 4px; }
  .logo.letter { font-weight: 600; color: var(--muted); }
  .logo .badge {
    position: absolute;
    right: -4px;
    bottom: -4px;
    width: 15px;
    height: 15px;
    padding: 2px;
    display: inline-flex;
    border-radius: 50%;
    background: var(--surface);
    box-shadow: 0 0 0 1px var(--line);
  }
  .logo .badge svg { width: 100%; height: 100%; }
  /* Personal info: an ID card, so it never reads as one more login. */
  button.idcard {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 12px 8px;
    border: 1px solid rgba(192, 193, 255, .35);
    border-radius: 12px;
    background: linear-gradient(135deg, #22254a 0%, #151a2c 55%, #10202a 100%);
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color .15s;
  }
  button.idcard:hover:not(:disabled) { border-color: var(--accent); }
  button.idcard:disabled { cursor: not-allowed; opacity: .55; }
  .id-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .id-chip {
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(192, 193, 255, .16);
    color: var(--accent);
    letter-spacing: .08em;
  }
  .id-body { display: flex; align-items: center; gap: 10px; }
  .id-photo {
    flex: 0 0 auto;
    width: 38px;
    height: 44px;
    padding: 5px;
    display: inline-flex;
    border-radius: 6px;
    background: rgba(192, 193, 255, .1);
    box-shadow: inset 0 0 0 1px rgba(192, 193, 255, .25);
  }
  .id-photo svg { width: 100%; height: 100%; }
  .id-strip {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 10px;
    letter-spacing: .12em;
    color: rgba(199, 196, 215, .45);
    overflow: hidden;
    white-space: nowrap;
  }
  .sub { font-size: 12px; color: var(--muted); }
  /* Not a button: a provider login has nothing to fill, only an account to
     be reminded of. Dashed border so it never reads as clickable. */
  .hint {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 1px dashed var(--line);
    border-radius: 8px;
  }
  button.hint {
    width: 100%;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  button.hint:hover { border-color: var(--accent); border-style: solid; }
  .hint .who {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12px;
    color: var(--accent);
    overflow-wrap: anywhere;
  }
  .row { display: flex; gap: 6px; }
  .code {
    flex: 1;
    min-width: 0;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 14px;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .code:focus { outline: none; border-color: var(--accent); }
  .primary {
    padding: 7px 14px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #1a1b2a;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .primary:disabled { opacity: .55; cursor: not-allowed; }
</style>
</head>
<body>
  <h1>Password Manager</h1>
  <div id="page" class="card"><span class="dim">Checking this page…</span></div>
  <div id="vault" class="card"><span class="dim">Checking the vault…</span></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
