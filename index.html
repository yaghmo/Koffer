THESIS: A locked vault, not a control panel. Dark, precise, glass-on-obsidian. Trust is signaled by restraint — one soft glow on the thing you press, everything else still.

MOTION: color/border/opacity transitions under 150ms on hover/focus, plus a static glow behind the primary button and the emblem. No spinners, no pulsing, no pinging, no fake delays. prefers-reduced-motion disables all of it.
STORY: unlock with a master password, find the one thing you came for, copy it, lock. No sync, no biometrics, no audit trail — a private local drawer.
