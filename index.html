    <!--
THESIS: A darkroom safelight bay fused with a cracktro's emissive void. No boxes, no rules, no chrome. Trust is signaled by absence of motion, not by a logo. The category default — a centered form on a flat panel — is refused.
OWN-WORLD: Depthless near-black ground with a single warm amber safelight zone where the user is working. One cool signal (teal) for active selection / focus / copy success. Type is a system humanist sans for prose and a system mono for codes, timestamps, and the master-password reveal. No border-weight chrome; depth comes from brightness step, letterspacing, and a single shared drift rate.
STORY: The user sits in a dim room. The app is the only light. They unlock with a password, find the one thing they came for, copy it, lock. The reset flow is "pulling the print too early" — irreversible, deliberate, amber-glowing.
FIRST VIEWPORT: The Lock screen. A single centered password field with no border, no fill — a slot, not a container. Above it, a thin amber safelight line the width of the field. The unlock button is a thin amber outline. Below, a hairline "Forgot password" link in a smaller, dimmer weight. The header is a single line of mono caps at the top edge. Nothing else.
FORM: Darkroom safelight bay + cracktro scroller, fused. Seed key 241bc83f (operate, direction roll); grounded challenger cracktro scroller weighed and folded in. Canon declined.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md.
    -->
