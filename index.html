  <body>
    <!--
THESIS: A password manager is opened for a few seconds to fetch one thing. Midnight keeps the room dark and quiet so that thing is the brightest object on screen. Depth comes from layered slate surfaces; one emerald accent marks the single action a screen is for.
PALETTE: canvas #0b0d10, surface #0f1216, raised #14181d, hairline #232931, text #e8ebef, muted #9ba3ae, emerald #3dbe8b, danger #f06a6f, amber #f2b544 on #2b2413. No blue, no purple, no gradient, no second accent.
TYPE: Inter (bundled) for the interface, IBM Plex Mono for secrets.
MOTION: 150ms colour and border transitions on hover and focus, nothing else. prefers-reduced-motion disables all of it.
STORY: unlock with a master password, find the one thing you came for, copy it, lock. No sync, no biometrics, no audit trail.
FORM: Midnight. The full rules are in DESIGN.md and are enforced by src/__tests__/designSystem.test.ts.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
