    <!--
THESIS: Koffer means suitcase, so the app dresses like the person carrying one. A black jacket (the sidebar), a white shirt (everything you read and type), one red tie (the single primary action of a screen), yellow tape for warnings. Flat and quiet. The mark is a locked case: white body, yellow handle, red keyhole.
PALETTE: jacket #121212, shirt #ffffff, ink #141414, tie #c8102e, tape #ffd60a. No green, no orange, no second accent. Red fills one element per screen; yellow is always a fill with ink text on it.
MOTION: 150ms colour transitions on hover and focus, nothing else. No glow, blur, spinners or pulsing. prefers-reduced-motion disables all of it.
STORY: unlock with a master password, find the one thing you came for, copy it, lock. No sync, no biometrics, no audit trail.
FORM: Suit and shirt. Replaces Obsidian Cipher (2026-09-13 to 2026-10-13). The full rules are in DESIGN.md and are enforced by src/__tests__/designSystem.test.ts.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
