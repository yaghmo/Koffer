# Three operating systems, because Tauri links the platform's own webview
# (WebView2, WKWebView, WebKitGTK) and none of them cross-compiles. A macOS
# .dmg needs a Mac; a .deb needs a Linux box with the GTK headers. This is
# the matrix that makes the app buildable anywhere other than the one Windows
# machine it grew up on.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Cargo's registry and this crate's build artifacts, keyed per OS so the
      # three legs never hand each other a target dir built for another host.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Only Linux needs anything installed: the others ship their webview.
      # libwebkit2gtk is the webview itself; libxdo is what the tray and the
      # global-shortcut plugins link against.
      - name: System dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The clipboard test knows to skip itself on a headless Linux runner:
      # there is no clipboard owner there, and failing on that would say
      # nothing about the code.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  bundle:
    name: bundle (${{ matrix.os }})
    # Installers are the slow part, so they are built for a tag or on
    # request, not on every push to a branch.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: System dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential

      - run: npm ci

      # Unsigned on every platform. macOS will refuse to open it without a
      # right-click → Open, and Windows SmartScreen will warn, until there
      # are certificates to sign with.
      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
