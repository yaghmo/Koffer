# Three operating systems, because Tauri links the platform's own webview
# (WebView2, WKWebView, WebKitGTK) and none of them cross-compiles. A macOS
# .dmg needs a Mac; a .deb needs a Linux box with the GTK headers. This is
# the matrix that makes the app buildable anywhere other than the one Windows
# machine it grew up on.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Read the code, nothing more: no job here writes to the repository.
permissions:
  contents: read

# Actions are pinned to a commit, not a tag: a tag can be moved to other code
# after it was reviewed, and the bundle job hands them signing secrets. The
# comment names the version to look for when updating.

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy

      # Cargo's registry and this crate's build artifacts, keyed per OS so the
      # three legs never hand each other a target dir built for another host.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # Only Linux needs anything installed: the others ship their webview.
      # libwebkit2gtk is the webview itself; libxdo is what the tray and the
      # global-shortcut plugins link against.
      - name: System dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The one test that writes the real clipboard is #[ignore]d: a headless
      # runner has no clipboard, and on a desktop it wipes the user's.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  bundle:
    name: bundle (${{ matrix.os }})
    # Installers are the slow part, so they are built for a tag or on
    # request, not on every push to a branch.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: System dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential

      - run: npm ci

      # The web part is built here, before any signing secret is in the job:
      # this runs every npm dev dependency's code, and none of it should be
      # able to read a certificate. `tauri build` below skips its own
      # frontend build for the same reason.
      - run: npm run build

      # Signing switches on by itself once its secrets exist, and not before:
      # a secret that was never set reads as "", and handing the bundler an
      # empty certificate fails the build instead of skipping the signature.
      # How to get each one is in SIGNING.md.
      #
      # macOS: a Developer ID Application certificate signs; the Apple ID
      # trio notarizes, without which Gatekeeper still refuses the app.
      - name: macOS signing
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || { echo "No Apple certificate: unsigned."; exit 0; }
          # Nothing goes into $GITHUB_ENV: every later step would see it.
          # The build step below is handed the notarization secrets itself.
          # A throwaway keychain holding only this certificate, as Tauri's
          # signing guide does it; the runner is discarded after the job.
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/certificate.p12"

      # Windows: the provider's own command, with %1 for the file. Every
      # current option (Azure Artifact Signing, DigiCert KeyLocker, Certum
      # SimplySign) keeps the key in the cloud or on a token and signs
      # through a command like this; a bare .pfx is no longer issued.
      - name: Windows signing
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: |
          [ -n "$WINDOWS_SIGN_COMMAND" ] || { echo "No Windows sign command: unsigned."; exit 0; }
          node -e 'console.log("SIGN_CONFIG=" + JSON.stringify({ bundle: { windows: { signCommand: process.env.WINDOWS_SIGN_COMMAND } } }))' >> "$GITHUB_ENV"

      - name: tauri build
        shell: bash
        # Whatever the provider's sign command needs to log in, e.g. Azure's
        # service principal. Unset secrets are simply empty here.
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # macOS: the identity the keychain step imported and the Apple ID
          # trio for notarization; empty on the other systems.
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        # The frontend was built above, without secrets; the empty hook stops
        # tauri building it again in here. An unset secret reads as "", which
        # the bundler would take as a value, so empty ones are dropped.
        run: |
          for name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || unset "$name"
          done
          npx tauri build --config '{"build":{"beforeBuildCommand":""}}' ${SIGN_CONFIG:+--config "$SIGN_CONFIG"}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
