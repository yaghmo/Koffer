# Three operating systems, because Tauri links the platform's own webview
# (WebView2, WKWebView, WebKitGTK) and none of them cross-compiles. A macOS
# .dmg needs a Mac; a .deb needs a Linux box with the GTK headers. This is
# the matrix that makes the app buildable anywhere other than the one Windows
# machine it grew up on.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Cargo's registry and this crate's build artifacts, keyed per OS so the
      # three legs never hand each other a target dir built for another host.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Only Linux needs anything installed: the others ship their webview.
      # libwebkit2gtk is the webview itself; libxdo is what the tray and the
      # global-shortcut plugins link against.
      - name: System dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The one test that writes the real clipboard is #[ignore]d: a headless
      # runner has no clipboard, and on a desktop it wipes the user's.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  bundle:
    name: bundle (${{ matrix.os }})
    # Installers are the slow part, so they are built for a tag or on
    # request, not on every push to a branch.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: System dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential

      - run: npm ci

      # Signing switches on by itself once its secrets exist, and not before:
      # a secret that was never set reads as "", and handing the bundler an
      # empty certificate fails the build instead of skipping the signature.
      # How to get each one is in SIGNING.md.
      #
      # macOS: a Developer ID Application certificate signs; the Apple ID
      # trio notarizes, without which Gatekeeper still refuses the app.
      - name: macOS signing
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || { echo "No Apple certificate: unsigned."; exit 0; }
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [ -n "$value" ] || continue
            echo "::add-mask::$value"
            { echo "$name<<EOF_$name"; echo "$value"; echo "EOF_$name"; } >> "$GITHUB_ENV"
          done
          # A throwaway keychain holding only this certificate, as Tauri's
          # signing guide does it; the runner is discarded after the job.
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/certificate.p12"

      # Windows: the provider's own command, with %1 for the file. Every
      # current option (Azure Artifact Signing, DigiCert KeyLocker, Certum
      # SimplySign) keeps the key in the cloud or on a token and signs
      # through a command like this; a bare .pfx is no longer issued.
      - name: Windows signing
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: |
          [ -n "$WINDOWS_SIGN_COMMAND" ] || { echo "No Windows sign command: unsigned."; exit 0; }
          node -e 'console.log("SIGN_CONFIG=" + JSON.stringify({ bundle: { windows: { signCommand: process.env.WINDOWS_SIGN_COMMAND } } }))' >> "$GITHUB_ENV"

      - name: tauri build
        shell: bash
        # Whatever the provider's sign command needs to log in, e.g. Azure's
        # service principal. Unset secrets are simply empty here.
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: npx tauri build ${SIGN_CONFIG:+--config "$SIGN_CONFIG"}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
