# Three operating systems, because Tauri links the platform's own webview
# (WebView2, WKWebView, WebKitGTK) and none of them cross-compiles. A macOS
# .dmg needs a Mac; a .deb needs a Linux box with the GTK headers. This is
# the matrix that makes the app buildable anywhere other than the one Windows
# machine it grew up on.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Read the code, nothing more. Only the publish job at the bottom writes to
# the repository, and it asks for that itself.
permissions:
  contents: read

# Actions are pinned to a commit, not a tag: a tag can be moved to other code
# after it was reviewed, and the bundle job hands them signing secrets. The
# comment names the version to look for when updating.

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy

      # Cargo's registry and this crate's build artifacts, keyed per OS so the
      # three legs never hand each other a target dir built for another host.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # Only Linux needs anything installed: the others ship their webview.
      # libwebkit2gtk is the webview itself; libxdo is what the tray and the
      # global-shortcut plugins link against.
      - name: System dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The one test that writes the real clipboard is #[ignore]d: a headless
      # runner has no clipboard, and on a desktop it wipes the user's.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  # Whether the updater's signing key is a secret yet. A job's `if` cannot
  # read secrets, so this one looks and reports; it runs no code but this.
  updater:
    name: updater key
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - id: key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -z "$KEY" ] || echo "key=true" >> "$GITHUB_OUTPUT"

  bundle:
    name: bundle (${{ matrix.os }})
    # Installers are the slow part, so they are built for a version tag or on
    # request. A tag builds once the updater key exists: that build is what
    # installed apps are offered as an update. A push to main builds nothing.
    if: >-
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && needs.updater.outputs.key == 'true') ||
      github.event_name == 'workflow_dispatch'
    needs: [test, updater]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: System dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential

      - run: npm ci

      # The web part is built here, before any signing secret is in the job:
      # this runs every npm dev dependency's code, and none of it should be
      # able to read a certificate. `tauri build` below skips its own
      # frontend build for the same reason.
      - run: npm run build

      # Signing switches on by itself once its secrets exist, and not before:
      # a secret that was never set reads as "", and handing the bundler an
      # empty certificate fails the build instead of skipping the signature.
      # How to get each one is in SIGNING.md.
      #
      # macOS: a Developer ID Application certificate signs; the Apple ID
      # trio notarizes, without which Gatekeeper still refuses the app.
      - name: macOS signing
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || { echo "No Apple certificate: unsigned."; exit 0; }
          # Nothing goes into $GITHUB_ENV: every later step would see it.
          # The build step below is handed the notarization secrets itself.
          # A throwaway keychain holding only this certificate, as Tauri's
          # signing guide does it; the runner is discarded after the job.
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/certificate.p12"

      # Windows: the provider's own command, with %1 for the file. Every
      # current option (Azure Artifact Signing, DigiCert KeyLocker, Certum
      # SimplySign) keeps the key in the cloud or on a token and signs
      # through a command like this; a bare .pfx is no longer issued.
      - name: Windows signing
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: |
          [ -n "$WINDOWS_SIGN_COMMAND" ] || { echo "No Windows sign command: unsigned."; exit 0; }
          node -e 'console.log("SIGN_CONFIG=" + JSON.stringify({ bundle: { windows: { signCommand: process.env.WINDOWS_SIGN_COMMAND } } }))' >> "$GITHUB_ENV"

      # The updater switches on the same way, once its key is a secret. A
      # tag is also the build's version: vX.Y.Z becomes X.Y.Z, since an
      # installed app only offers a build whose version is higher than its
      # own. Any tag but a plain vX.Y.Z fails here, before the long build.
      - name: Updater artifacts
        if: needs.updater.outputs.key == 'true'
        shell: bash
        run: |
          node -e '
            const config = { bundle: { createUpdaterArtifacts: true } };
            if (process.env.GITHUB_REF_TYPE === "tag") {
              const tag = process.env.GITHUB_REF_NAME;
              if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error("Tag " + tag + " is not vX.Y.Z.");
              config.version = tag.slice(1);
              console.log("UPDATE_VERSION=" + config.version);
            }
            console.log("UPDATER_CONFIG=" + JSON.stringify(config));
          ' >> "$GITHUB_ENV"

      - name: tauri build
        shell: bash
        # Whatever the provider's sign command needs to log in, e.g. Azure's
        # service principal. Unset secrets are simply empty here.
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # macOS: the identity the keychain step imported and the Apple ID
          # trio for notarization; empty on the other systems.
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          # Signs the updater artifacts. The password stays in the
          # environment even when empty: a key made without one needs "".
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # The frontend was built above, without secrets; the empty hook stops
        # tauri building it again in here. An unset secret reads as "", which
        # the bundler would take as a value, so empty ones are dropped.
        run: |
          for name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY; do
            [ -n "${!name}" ] || unset "$name"
          done
          npx tauri build --config '{"build":{"beforeBuildCommand":""}}' ${SIGN_CONFIG:+--config "$SIGN_CONFIG"} ${UPDATER_CONFIG:+--config "$UPDATER_CONFIG"}

      # What an installed app reads to learn there is something newer: the
      # version, and for each installer its address in the release the
      # publish job is about to create, with the signature the app checks
      # the download against before running it.
      - name: Update manifest
        if: env.UPDATE_VERSION != ''
        shell: bash
        working-directory: src-tauri/target/release/bundle
        run: |
          node -e '
            const fs = require("fs");
            const [version, repo] = process.argv.slice(1);
            const entry = (dir, suffix) => {
              const file = fs.readdirSync(dir).find((f) => f.includes("_" + version + "_") && f.endsWith(suffix));
              return {
                signature: fs.readFileSync(dir + "/" + file + ".sig", "utf8").trim(),
                url: "https://github.com/" + repo + "/releases/download/v" + version + "/" + file,
              };
            };
            // An app asks for its own installer type first, then the bare
            // platform: that one is the .msi, which the README hands out.
            const msi = entry("msi", ".msi");
            const platforms = { "windows-x86_64": msi, "windows-x86_64-msi": msi, "windows-x86_64-nsis": entry("nsis", "-setup.exe") };
            fs.writeFileSync("latest.json", JSON.stringify({ version, pub_date: new Date().toISOString(), platforms }, null, 2));
          ' "$UPDATE_VERSION" "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/latest.json

  publish:
    name: publish update
    # A version tag that the bundle job built becomes a release, which is
    # where installed apps look for a newer version. The one job that writes
    # to the repository, and it runs nothing from it: it only moves the files
    # the bundle job built and signed.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      actions: read # this run's installers
      contents: write # the release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Release
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name installers-windows-latest --dir out
          cd out
          version="$(jq -r .version latest.json)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "latest.json says $version, tag is $GITHUB_REF_NAME."; exit 1; }
          {
            echo "Release $GITHUB_REF_NAME. Installed copies of Koffer offer it the next time they start."
            echo
            echo "SHA-256:"
            echo '```'
            sha256sum msi/*_"$version"_*.msi nsis/*_"$version"_*-setup.exe
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Koffer $version" --notes-file notes.md \
            latest.json msi/*_"$version"_*.msi nsis/*_"$version"_*-setup.exe
