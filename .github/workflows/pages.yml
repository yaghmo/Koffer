# Publishes testsite/ on GitHub Pages, so anyone can try the extension on a
# fake site instead of their real accounts. Static files only: no build step.
name: Test site

on:
  push:
    branches: [main]
    paths: ["testsite/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Pages needs to write its deployment and to prove who is deploying; nothing
# else is granted.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pinned to commits, as in ci.yml; the comment names the version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # serve.mjs is the local server; the page does not need it.
      - run: rm testsite/serve.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: testsite
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
